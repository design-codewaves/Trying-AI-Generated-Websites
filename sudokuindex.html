<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sudoku Master</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F5F0;--bg2:#EDE9E1;--fg:#1A1A2E;--fg2:#6B6B80;
  --accent:#0D7377;--accent-lt:#14BDBD;--accent-bg:#E0F5F5;
  --gold:#D4940A;--gold-lt:#F5D580;--gold-bg:#FFF8E8;
  --err:#D94040;--err-bg:#FDEAEA;--ok:#2D8F4E;--ok-bg:#E6F5EC;
  --card:#FFFFFF;--border:#D0CCC4;
  --cell-given:#1A1A2E;--cell-player:#0D7377;
  --cell-sel:#C8ECEC;--cell-hl:#F0EDE6;--cell-same:#D5F0F0;--cell-err:#FDEAEA;
  --shadow:0 2px 12px rgba(0,0,0,.08);--shadow-lg:0 8px 32px rgba(0,0,0,.12);
  --radius:12px;--radius-sm:8px;
}
.dark{
  --bg:#0F0F14;--bg2:#1A1A22;--fg:#E8E6E1;--fg2:#8B8B9A;
  --accent:#14BDBD;--accent-lt:#2EEAEA;--accent-bg:#0A2E2E;
  --gold:#F0B840;--gold-lt:#5C4510;--gold-bg:#1E1A0A;
  --err:#FF6B6B;--err-bg:#3A1515;--ok:#4ADE80;--ok-bg:#0A2E1A;
  --card:#1E1E28;--border:#2E2E3A;
  --cell-given:#E8E6E1;--cell-player:#14BDBD;
  --cell-sel:#1A3A3A;--cell-hl:#1A1A24;--cell-same:#142E2E;--cell-err:#3A1515;
  --shadow:0 2px 12px rgba(0,0,0,.3);--shadow-lg:0 8px 32px rgba(0,0,0,.4);
}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--fg);
  transition:background .3s,color .3s;
  -webkit-tap-highlight-color:transparent;user-select:none;
}
#app{
  height:100%;display:flex;flex-direction:column;overflow:hidden;
  max-width:500px;margin:0 auto;position:relative;
}
.screen{display:none;flex-direction:column;height:100%;overflow-y:auto;overflow-x:hidden}
.screen.active{display:flex}
.screen::-webkit-scrollbar{width:0}

/* 顶部导航 */
.top-bar{
  display:flex;align-items:center;gap:12px;padding:12px 16px;
  min-height:52px;flex-shrink:0;
}
.top-bar .back-btn{
  width:36px;height:36px;border-radius:50%;border:none;
  background:var(--bg2);color:var(--fg);font-size:16px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:all .15s;
}
.top-bar .back-btn:hover{background:var(--accent-bg);color:var(--accent)}
.top-bar .title{flex:1;font-weight:600;font-size:17px}
.top-bar .action-btn{
  width:36px;height:36px;border-radius:50%;border:none;
  background:transparent;color:var(--fg2);font-size:16px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:all .15s;
}
.top-bar .action-btn:hover{background:var(--bg2);color:var(--fg)}

/* 首页 */
.home-bg{
  position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;
  pointer-events:none;z-index:0;
}
.home-bg .float-num{
  position:absolute;font-size:48px;font-weight:700;opacity:.04;
  color:var(--accent);animation:floatNum 20s infinite linear;
}
@keyframes floatNum{
  0%{transform:translateY(100vh) rotate(0deg)}
  100%{transform:translateY(-100px) rotate(360deg)}
}
.home-content{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:40px 24px;position:relative;z-index:1;gap:12px;
}
.home-logo{
  font-size:42px;font-weight:700;letter-spacing:-1px;
  background:linear-gradient(135deg,var(--accent),var(--accent-lt));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;margin-bottom:4px;
}
.home-sub{color:var(--fg2);font-size:14px;margin-bottom:20px;font-weight:300}
.home-stats{
  display:flex;gap:24px;margin-bottom:28px;
}
.home-stat{text-align:center}
.home-stat .val{font-size:24px;font-weight:700;color:var(--accent)}
.home-stat .lbl{font-size:11px;color:var(--fg2);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}

/* 按钮 */
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:14px 28px;border-radius:var(--radius);border:none;
  font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;
  transition:all .2s;width:100%;max-width:300px;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-lt);box-shadow:0 4px 16px rgba(13,115,119,.3)}
.btn-secondary{background:var(--bg2);color:var(--fg)}
.btn-secondary:hover{background:var(--border)}
.btn-gold{background:linear-gradient(135deg,#D4940A,#F0B840);color:#fff}
.btn-gold:hover{box-shadow:0 4px 16px rgba(212,148,10,.3)}
.btn-outline{background:transparent;border:2px solid var(--border);color:var(--fg)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:10px 18px;font-size:13px;max-width:none}
.btn:disabled{opacity:.4;pointer-events:none}

/* 卡片 */
.card{
  background:var(--card);border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow);transition:all .2s;
}
.card:hover{box-shadow:var(--shadow-lg)}
.card-grid{display:grid;gap:12px;padding:0 16px}

/* 难度选择 */
.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.diff-card{
  background:var(--card);border-radius:var(--radius);padding:20px 16px;
  text-align:center;cursor:pointer;box-shadow:var(--shadow);
  transition:all .2s;border:2px solid transparent;position:relative;overflow:hidden;
}
.diff-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.diff-card.locked{opacity:.5;pointer-events:none}
.diff-card .lock-icon{
  position:absolute;top:8px;right:8px;font-size:12px;color:var(--fg2);
}
.diff-card .diff-icon{font-size:28px;margin-bottom:8px}
.diff-card .diff-name{font-weight:600;font-size:16px;margin-bottom:4px}
.diff-card .diff-desc{font-size:12px;color:var(--fg2)}

/* 关卡选择 */
.level-header{padding:16px 16px 8px;display:flex;align-items:center;gap:12px}
.level-header .diff-badge{
  padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;color:#fff;
}
.level-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:8px 16px 24px}
.level-btn{
  aspect-ratio:1;border-radius:var(--radius-sm);border:2px solid var(--border);
  background:var(--card);display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;
  font-weight:600;font-size:16px;transition:all .15s;position:relative;
}
.level-btn:hover:not(.locked){border-color:var(--accent);transform:scale(1.05)}
.level-btn.completed{border-color:var(--ok);background:var(--ok-bg)}
.level-btn.locked{opacity:.35;pointer-events:none}
.level-btn .stars{font-size:8px;color:var(--gold);margin-top:2px;letter-spacing:1px}

/* 游戏界面 */
.game-top{display:flex;align-items:center;gap:8px;padding:8px 12px;flex-shrink:0}
.game-top .diff-tag{
  padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;color:#fff;
}
.game-timer{
  margin-left:auto;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;
  color:var(--fg);
}
.mistakes-bar{
  display:flex;align-items:center;gap:6px;padding:0 16px 8px;font-size:12px;color:var(--fg2);flex-shrink:0;
}
.mistakes-bar .dot{
  width:10px;height:10px;border-radius:50%;border:2px solid var(--err);
  transition:all .2s;
}
.mistakes-bar .dot.used{background:var(--err)}

/* 棋盘 */
.board-wrap{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:0 12px;min-height:0;
}
.board{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:2px;background:var(--accent);border-radius:var(--radius);
  overflow:hidden;box-shadow:var(--shadow-lg);
  width:min(calc(100vw - 24px),calc(100vh - 280px),420px);
  aspect-ratio:1;
}
.box{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border)}
.cell{
  background:var(--card);display:flex;align-items:center;justify-content:center;
  font-size:clamp(16px,4.5vw,22px);font-weight:500;cursor:pointer;
  position:relative;transition:background .1s;aspect-ratio:1;
}
.cell.given{font-weight:700;color:var(--cell-given)}
.cell.player{color:var(--cell-player)}
.cell.selected{background:var(--cell-sel)!important}
.cell.highlighted{background:var(--cell-hl)}
.cell.same-num{background:var(--cell-same)}
.cell.error{background:var(--cell-err)!important;color:var(--err)!important;animation:shake .3s}
.cell.hint-cell{animation:hintPop .4s ease}
.cell .notes-grid{
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  width:100%;height:100%;position:absolute;top:0;left:0;
}
.cell .notes-grid span{
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(7px,1.8vw,10px);color:var(--fg2);font-weight:400;
}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes hintPop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
@keyframes numPop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.cell.just-placed{animation:numPop .25s ease}

/* 数字剩余计数 */
.num-counts{
  display:flex;justify-content:center;gap:4px;padding:8px 12px 4px;flex-shrink:0;
}
.num-count{
  width:clamp(24px,7vw,32px);height:20px;border-radius:10px;
  background:var(--bg2);display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:600;color:var(--fg2);transition:all .2s;
}
.num-count.done{background:var(--accent-bg);color:var(--accent);opacity:.4}

/* 数字键盘 */
.numpad{
  display:flex;justify-content:center;gap:clamp(4px,1.2vw,8px);
  padding:6px 12px;flex-shrink:0;
}
.num-btn{
  width:clamp(32px,9vw,44px);height:clamp(38px,10vw,50px);
  border-radius:var(--radius-sm);border:none;background:var(--card);
  font-family:inherit;font-size:clamp(16px,4.5vw,22px);font-weight:600;
  color:var(--fg);cursor:pointer;box-shadow:var(--shadow);
  transition:all .15s;position:relative;
}
.num-btn:hover{background:var(--accent-bg);color:var(--accent)}
.num-btn:active{transform:scale(.93)}
.num-btn.active{background:var(--accent);color:#fff}
.num-btn .remaining{
  position:absolute;top:2px;right:4px;font-size:8px;font-weight:400;
  color:var(--fg2);
}
.num-btn.active .remaining{color:rgba(255,255,255,.7)}

/* 操作栏 */
.action-bar{
  display:flex;justify-content:center;gap:clamp(8px,2.5vw,16px);
  padding:6px 16px 8px;flex-shrink:0;
}
.act-btn{
  width:clamp(44px,12vw,56px);height:clamp(38px,10vw,46px);
  border-radius:var(--radius-sm);border:none;background:var(--bg2);
  color:var(--fg2);font-size:16px;cursor:pointer;transition:all .15s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
}
.act-btn span{font-size:9px;font-weight:500}
.act-btn:hover{background:var(--accent-bg);color:var(--accent)}
.act-btn.active{background:var(--accent);color:#fff}
.act-btn .badge{
  position:absolute;top:-4px;right:-4px;width:16px;height:16px;
  border-radius:50%;background:var(--gold);color:#fff;font-size:9px;
  display:flex;align-items:center;justify-content:center;font-weight:700;
}

/* 广告条 */
.ad-banner{
  margin:4px 12px 8px;padding:10px;border-radius:var(--radius-sm);
  background:var(--bg2);text-align:center;font-size:11px;color:var(--fg2);
  flex-shrink:0;border:1px dashed var(--border);
}
.ad-banner i{margin-right:4px;color:var(--gold)}

/* 模态框 */
.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.5);z-index:100;
  display:none;align-items:center;justify-content:center;padding:24px;
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.modal-overlay.active{display:flex}
.modal{
  background:var(--card);border-radius:16px;padding:28px 24px;
  max-width:340px;width:100%;text-align:center;
  box-shadow:var(--shadow-lg);animation:modalIn .25s ease;
}
@keyframes modalIn{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.modal h2{font-size:22px;font-weight:700;margin-bottom:8px}
.modal p{font-size:13px;color:var(--fg2);margin-bottom:16px;line-height:1.5}
.modal .stars-display{font-size:32px;color:var(--gold);margin:12px 0;letter-spacing:4px}
.modal .score-display{font-size:36px;font-weight:700;color:var(--accent);margin:4px 0}
.modal .btn{margin-top:8px}

/* 成就 */
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px}
.ach-card{
  background:var(--card);border-radius:var(--radius);padding:14px;
  box-shadow:var(--shadow);text-align:center;transition:all .2s;
  border:2px solid transparent;
}
.ach-card.unlocked{border-color:var(--gold);background:var(--gold-bg)}
.ach-card .ach-icon{font-size:24px;color:var(--fg2);margin-bottom:6px}
.ach-card.unlocked .ach-icon{color:var(--gold)}
.ach-card .ach-name{font-size:12px;font-weight:600;margin-bottom:2px}
.ach-card .ach-desc{font-size:10px;color:var(--fg2);line-height:1.3}

/* 排行榜 */
.lb-list{padding:8px 16px;display:flex;flex-direction:column;gap:6px}
.lb-row{
  display:flex;align-items:center;gap:12px;padding:10px 14px;
  background:var(--card);border-radius:var(--radius-sm);box-shadow:var(--shadow);
}
.lb-row.me{border:2px solid var(--accent);background:var(--accent-bg)}
.lb-rank{width:28px;font-weight:700;font-size:16px;text-align:center;color:var(--fg2)}
.lb-row:nth-child(1) .lb-rank{color:var(--gold)}
.lb-row:nth-child(2) .lb-rank{color:#A0A0A0}
.lb-row:nth-child(3) .lb-rank{color:#CD7F32}
.lb-name{flex:1;font-weight:500;font-size:14px}
.lb-score{font-weight:700;font-size:14px;color:var(--accent)}
.lb-time{font-size:11px;color:var(--fg2);min-width:50px;text-align:right}

/* 设置 */
.settings-list{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.setting-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.setting-row .label{font-size:14px;font-weight:500}
.setting-row .desc{font-size:11px;color:var(--fg2);margin-top:2px}
/* 开关 */
.toggle{
  width:44px;height:24px;border-radius:12px;background:var(--border);
  cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;
}
.toggle.on{background:var(--accent)}
.toggle::after{
  content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;
  border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.toggle.on::after{transform:translateX(20px)}

/* 主题选择 */
.theme-row{display:flex;gap:10px;padding:8px 0}
.theme-dot{
  width:32px;height:32px;border-radius:50%;cursor:pointer;
  border:3px solid transparent;transition:all .15s;
}
.theme-dot.active{border-color:var(--fg);transform:scale(1.15)}

/* 商店 */
.shop-grid{display:grid;gap:12px;padding:12px 16px}
.shop-card{
  background:var(--card);border-radius:var(--radius);padding:20px;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;
  cursor:pointer;transition:all .2s;border:2px solid transparent;
}
.shop-card:hover{border-color:var(--accent)}
.shop-card.owned{border-color:var(--ok);opacity:.7}
.shop-card .shop-icon{
  width:52px;height:52px;border-radius:12px;display:flex;
  align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
}
.shop-card .shop-info{flex:1}
.shop-card .shop-name{font-weight:600;font-size:15px;margin-bottom:2px}
.shop-card .shop-desc{font-size:11px;color:var(--fg2);line-height:1.3}
.shop-card .shop-price{
  font-weight:700;font-size:15px;color:var(--accent);flex-shrink:0;
}

/* Toast */
#toast-container{
  position:fixed;top:60px;left:50%;transform:translateX(-50%);
  z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
.toast{
  padding:10px 20px;border-radius:var(--radius);background:var(--fg);
  color:var(--bg);font-size:13px;font-weight:500;white-space:nowrap;
  animation:toastIn .3s ease,toastOut .3s ease 2s forwards;
  box-shadow:var(--shadow-lg);
}
@keyframes toastIn{0%{opacity:0;transform:translateY(-10px)}100%{opacity:1;transform:translateY(0)}}
@keyframes toastOut{0%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}

/* 进度条 */
.progress-bar{
  height:4px;background:var(--bg2);border-radius:2px;overflow:hidden;margin:8px 16px;flex-shrink:0;
}
.progress-bar .fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}

/* 每日挑战横幅 */
.daily-banner{
  margin:0 16px 12px;padding:16px 20px;border-radius:var(--radius);
  background:linear-gradient(135deg,var(--gold-bg),var(--accent-bg));
  border:1px solid var(--gold);cursor:pointer;transition:all .2s;
  display:flex;align-items:center;gap:14px;
}
.daily-banner:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.daily-banner .daily-icon{font-size:24px;color:var(--gold)}
.daily-banner .daily-info{flex:1}
.daily-banner .daily-title{font-weight:600;font-size:14px}
.daily-banner .daily-desc{font-size:11px;color:var(--fg2);margin-top:2px}
.daily-banner .daily-arrow{color:var(--fg2);font-size:14px}

/* 连胜 */
.streak-badge{
  display:inline-flex;align-items:center;gap:4px;padding:3px 10px;
  border-radius:12px;background:var(--gold-bg);color:var(--gold);
  font-size:11px;font-weight:600;
}

/* 分隔标题 */
.section-title{
  padding:16px 16px 8px;font-size:13px;font-weight:600;color:var(--fg2);
  text-transform:uppercase;letter-spacing:.5px;
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-container"></div>
<div class="modal-overlay" id="modal-pause"></div>
<div class="modal-overlay" id="modal-complete"></div>
<div class="modal-overlay" id="modal-gameover"></div>

<script>
// ==================== 常量配置 ====================
const DIFFS = {
  easy:   { name:'Easy',   clues:[38,42], time:600,  base:100, color:'#2D8F4E', icon:'fa-seedling', desc:'Great for beginners' },
  medium: { name:'Medium', clues:[30,35], time:1200, base:200, color:'#D4940A', icon:'fa-fire',      desc:'A solid challenge' },
  hard:   { name:'Hard',   clues:[24,29], time:1800, base:350, color:'#C75030', icon:'fa-bolt',      desc:'For experienced players' },
  expert: { name:'Expert', clues:[20,23], time:2700, base:500, color:'#8B2252', icon:'fa-skull',     desc:'Only the brave' }
};
const LVLS = 20, MAX_HINTS = 3, MAX_MISTAKES = 3, TIME_BONUS = 200;
const ACHS = [
  { id:'first_win',    name:'First Victory',      desc:'Complete your first puzzle',        icon:'fa-trophy' },
  { id:'ten_wins',     name:'Rising Star',         desc:'Complete 10 puzzles',               icon:'fa-star' },
  { id:'fifty_wins',   name:'Veteran',              desc:'Complete 50 puzzles',               icon:'fa-medal' },
  { id:'speed_3',      name:'Speed Runner',         desc:'Finish any puzzle under 3 minutes', icon:'fa-bolt' },
  { id:'flawless',     name:'Flawless',             desc:'Complete with zero mistakes',       icon:'fa-gem' },
  { id:'no_hints',     name:'No Help Needed',       desc:'Complete without using hints',      icon:'fa-brain' },

  { id:'stars_15',     name:'Three Star Collector', desc:'Earn 3 stars on 15 puzzles',        icon:'fa-crown' },

// ==================== 工具函数 ====================
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function deepCopy(m){return m.map(r=>[...r])}
function fmt(s){const m=Math.floor(s/60),sec=s%60;return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}
function today(){return new Date().toISOString().split('T')[0]}

// 带种子的随机数生成器
function seededRng(seed){
  let s=seed;
  return()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff};
}

// ==================== 数独引擎 ====================
function isValid(b,r,c,n){
  for(let i=0;i<9;i++){
    if(b[r][i]===n||b[i][c]===n)return false;
  }
  const br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;
  for(let i=br;i<br+3;i++)for(let j=bc;j<bc+3;j++)if(b[i][j]===n)return false;
  return true;
}

function fillBoard(b,rng){
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){
    if(b[r][c]===0){
      let nums=[1,2,3,4,5,6,7,8,9];
      if(rng)nums.sort(()=>rng()-.5); else shuffle(nums);
      for(const n of nums){
        if(isValid(b,r,c,n)){b[r][c]=n;if(fillBoard(b,rng))return true;b[r][c]=0;}
      }
      return false;
    }
  }
  return true;
}

function generateBoard(rng){
  const b=Array.from({length:9},()=>Array(9).fill(0));
  fillBoard(b,rng);
  return b;
}

// 计算解的数量（最多到limit就停）
function countSolutions(b,limit=2){
  let count=0;
  function solve(){
    if(count>=limit)return;
    let minC=10,best=null;
    for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(b[r][c]===0){
      let cn=0;for(let n=1;n<=9;n++)if(isValid(b,r,c,n))cn++;
      if(cn<minC){minC=cn;best={r,c};if(cn<=1)break;}
    }
    if(!best){count++;return;}
    if(minC===0)return;
    for(let n=1;n<=9;n++){
      if(count>=limit)return;
      if(isValid(b,best.r,best.c,n)){b[best.r][best.c]=n;solve();b[best.r][best.c]=0;}
    }
  }
  solve();
  return count;
}

function createPuzzle(diff,rng){
  const solution=generateBoard(rng);
  const [minClues,maxClues]=DIFFS[diff].clues;
  const target=minClues+Math.floor((maxClues-minClues)*Math.random());
  const puzzle=deepCopy(solution);
  const positions=shuffle(Array.from({length:81},(_,i)=>[Math.floor(i/9),i%9]));
  let removed=0,iter=0;
  for(const [r,c] of positions){
    if(removed>=81-target)break;
    if(iter++>200)break;
    const val=puzzle[r][c];
    puzzle[r][c]=0;
    if(countSolutions(deepCopy(puzzle),2)===1){removed++;}
    else{puzzle[r][c]=val;}
  }
  return {puzzle,solution};
}

// ==================== 音频引擎 ====================
let audioCtx;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function playSound(type){
  if(!S.sound||!audioCtx)return;
  try{
    const now=audioCtx.currentTime;
    if(type==='complete'){
      [523,659,784,1047].forEach((f,i)=>{
        const o=audioCtx.createOscillator(),g=audioCtx.createGain();
        o.connect(g);g.connect(audioCtx.destination);o.type='sine';
        o.frequency.setValueAtTime(f,now+i*.12);
        g.gain.setValueAtTime(.08,now+i*.12);
        g.gain.exponentialRampToValueAtTime(.001,now+i*.12+.3);
        o.start(now+i*.12);o.stop(now+i*.12+.3);
      });return;
    }
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    switch(type){
      case'place':o.frequency.setValueAtTime(880,now);g.gain.setValueAtTime(.06,now);g.gain.exponentialRampToValueAtTime(.001,now+.06);o.start(now);o.stop(now+.06);break;
      case'error':o.type='sawtooth';o.frequency.setValueAtTime(180,now);g.gain.setValueAtTime(.06,now);g.gain.exponentialRampToValueAtTime(.001,now+.18);o.start(now);o.stop(now+.18);break;
      case'tap':o.frequency.setValueAtTime(600,now);g.gain.setValueAtTime(.03,now);g.gain.exponentialRampToValueAtTime(.001,now+.03);o.start(now);o.stop(now+.03);break;
      case'hint':o.frequency.setValueAtTime(660,now);o.frequency.linearRampToValueAtTime(880,now+.15);g.gain.setValueAtTime(.06,now);g.gain.exponentialRampToValueAtTime(.001,now+.2);o.start(now);o.stop(now+.2);break;
    }
  }catch(e){}
}

// ==================== 计分 ====================
function calcScore(diff,time,mistakes,hintsUsed){
  const base=DIFFS[diff].base;
  const timeBonus=Math.max(0,TIME_BONUS-Math.floor(time/DIFFS[diff].time*TIME_BONUS));
  const mistakePen=mistakes*20;
  const hintPen=hintsUsed*30;
  return Math.max(10,base+timeBonus-mistakePen-hintPen);
}
function calcStars(diff,score){
  const max=DIFFS[diff].base+TIME_BONUS;
  if(score>=max*.8)return 3;if(score>=max*.5)return 2;return 1;
}

// ==================== 关卡解锁 ====================
function isDiffUnlocked(diff){
  if(diff==='easy')return true;
  if(diff==='medium')return S.totalSolved>=5;
  if(diff==='hard'){
    let m=0;for(let i=0;i<LVLS;i++)if(S.levelData['medium_'+i]?.completed)m++;return m>=10;
  }
  if(diff==='expert'){
    let h=0;for(let i=0;i<LVLS;i++)if(S.levelData['hard_'+i]?.completed)h++;return h>=10;
  }
  return false;
}
function isLevelUnlocked(diff,lv){
  if(!isDiffUnlocked(diff))return false;
  if(lv===0)return true;
  return !!S.levelData[diff+'_'+(lv-1)]?.completed;
}

// ==================== 排行榜生成 ====================
function getLeaderboard(diff){
  const entries=FAKE_NAMES.map(name=>{
    const t=60+Math.floor(Math.random()*600);
    return{name,score:Math.floor(DIFFS[diff].base+Math.random()*TIME_BONUS),time:t};
  });
  // 插入玩家最佳分数
  let bestScore=0,bestTime=Infinity;
  for(let i=0;i<LVLS;i++){
    const ld=S.levelData[diff+'_'+i];
    if(ld&&ld.bestScore>bestScore){bestScore=ld.bestScore;bestTime=ld.bestTime;}
  }
  if(bestScore>0)entries.push({name:'You',score:bestScore,time:bestTime,isMe:true});
  entries.sort((a,b)=>b.score-a.score||a.time-b.time);
  return entries.slice(0,20);
}

function updateBoard(){
  const boardEl=document.getElementById('board');if(!boardEl)return;
  // 构建9个box，每个box 9个cell
  let html='';
  for(let box=0;box<9;box++){
    html+='<div class="box">';
    for(let lc=0;lc<9;lc++){
      const lr=Math.floor(lc/3),lcc=lc%3;
      const r=Math.floor(box/3)*3+lr, c=(box%3)*3+lcc;
      const val=S.board[r][c], given=S.puzzle[r][c]!==0;
      const sel=S.selected&&S.selected.r===r&&S.selected.c===c;
      const inSameRC=S.highlightRC&&S.selected&&(
        S.selected.r===r||S.selected.c===c||
        (Math.floor(S.selected.r/3)===Math.floor(r/3)&&Math.floor(S.selected.c/3)===Math.floor(c/3))
      );
      const sameNum=S.highlightSame&&S.selected&&S.board[S.selected.r][S.selected.c]!==0&&val===S.board[S.selected.r][S.selected.c];
      const isError=S.autoCheck&&val!==0&&!given&&val!==S.solution[r][c];
      let cls='cell';
      if(given)cls+=' given';else if(val)cls+=' player';
      if(sel)cls+=' selected';else if(sameNum)cls+=' same-num';else if(inSameRC)cls+=' highlighted';
      if(isError)cls+=' error';

      let inner='';
      if(val){
        inner=`<span>${val}</span>`;
      }else{
        const notes=S.notes[r][c];
        if(notes.size>0){
          inner='<div class="notes-grid">';
          for(let n=1;n<=9;n++)inner+=`<span>${notes.has(n)?n:''}</span>`;
          inner+='</div>';
        }
      }
      html+=`<div class="${cls}" data-r="${r}" data-c="${c}">${inner}</div>`;
    }
    html+='</div>';
  }
  boardEl.innerHTML=html;

  // 数字剩余计数
  const countsEl=document.getElementById('num-counts');
  if(countsEl){
    let ch='';
    for(let n=1;n<=9;n++){
      let cnt=0;for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(S.board[r][c]===n)cnt++;
      ch+=`<div class="num-count ${cnt>=9?'done':''}">${9-cnt}</div>`;
    }
    countsEl.innerHTML=ch;
  }

  // 数字键盘
  const npEl=document.getElementById('numpad');
  if(npEl){
    let nh='';
    for(let n=1;n<=9;n++){
      let cnt=0;for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(S.board[r][c]===n)cnt++;
      const active=S.selected&&S.board[S.selected.r][S.selected.c]===n;
      nh+=`<button class="num-btn ${active?'active':''}" data-num="${n}" ${cnt>=9?'disabled':''}>${n}</button>`;
    }
    npEl.innerHTML=nh;
  }

  // 进度条
  const progEl=document.getElementById('game-progress');
  if(progEl){
    let filled=0;for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(S.board[r][c]!==0)filled++;
    progEl.style.width=(filled/81*100)+'%';
  }
}

// ==================== 游戏逻辑 ====================
function go(screen){
  S.prevScreen=S.screen;S.screen=screen;
  if(screen==='leaderboard'&&!S.lbDiff)S.lbDiff='easy';
  render();save();
}
function selectDiff(d){S.difficulty=d;go('levels');}

function startLevel(lv){
  initAudio();
  S.level=lv;S.isDaily=false;
  const {puzzle,solution}=createPuzzle(S.difficulty);
  S.puzzle=puzzle;S.solution=solution;S.board=deepCopy(puzzle);
  S.notes=Array.from({length:9},()=>Array.from({length:9},()=>new Set()));
  S.selected=null;S.timer=0;S.paused=false;S.hintsLeft=MAX_HINTS;S.mistakes=0;
  S.notesMode=false;S.history=[];S.savedGame=null;
  go('game');startTimer();
}

function startDaily(){
  initAudio();
  const td=today();
  if(S.lastDaily===td){toast('Already completed today!');return;}
  const seed=td.split('-').join('')|0;
  const rng=seededRng(seed);
  // 根据日期选难度
  const diffs=['easy','medium','hard','expert'];
  const diffIdx=seed%4;S.difficulty=diffs[diffIdx];
  const {puzzle,solution}=createPuzzle(S.difficulty,rng);
  S.puzzle=puzzle;S.solution=solution;S.board=deepCopy(puzzle);
  S.notes=Array.from({length:9},()=>Array.from({length:9},()=>new Set()));
  S.selected=null;S.timer=0;S.paused=false;S.hintsLeft=MAX_HINTS;S.mistakes=0;
  S.notesMode=false;S.history=[];S.isDaily=true;S.level=-1;S.savedGame=null;
  go('game');startTimer();
}

function resumeGame(){
  if(!S.savedGame)return;
  const sg=S.savedGame;
  Object.assign(S,sg);
  S.paused=false;S.screen='game';
  render();startTimer();
}

// 计时器
let timerInterval=null;
function startTimer(){
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    if(!S.paused&&S.screen==='game'){S.timer++;S.totalTime++;
      const el=document.getElementById('timer-display');
      if(el)el.textContent=fmt(S.timer);
    }
  },1000);
}

function pauseGame(){
  S.paused=true;
  const m=document.getElementById('modal-pause');
  m.classList.add('active');
  m.innerHTML=`<div class="modal">
    <h2>Game Paused</h2>
    <p>Take a break. Your progress is saved.</p>
    <button class="btn btn-primary" onclick="resumeFromPause()">Resume</button>
    <button class="btn btn-secondary" onclick="quitGame()">Quit</button>
  </div>`;
}
function resumeFromPause(){
  S.paused=false;
  document.getElementById('modal-pause').classList.remove('active');
}
function quitGame(){
  S.paused=false;clearInterval(timerInterval);
  S.savedGame={
    puzzle:S.puzzle,solution:S.solution,board:S.board,notes:S.notes.map(r=>r.map(s=>[...s])),
    difficulty:S.difficulty,level:S.level,isDaily:S.isDaily,
    timer:S.timer,hintsLeft:S.hintsLeft,mistakes:S.mistakes,
    history:S.history
  };
  document.getElementById('modal-pause').classList.remove('active');
  save();go('home');
}

// 选择格子
function selectCell(r,c){
  S.selected={r,c};updateBoard();playSound('tap');
}

// 放置数字
function placeNumber(n){
  if(!S.selected||S.paused)return;
  const {r,c}=S.selected;
  if(S.puzzle[r][c]!==0)return; // 给定数字不能改

  if(S.notesMode){
    // 笔记模式
    const prev=new Set(S.notes[r][c]);
    if(S.notes[r][c].has(n))S.notes[r][c].delete(n);else S.notes[r][c].add(n);
    S.history.push({type:'note',r,c,prev,next:new Set(S.notes[r][c])});
    if(S.board[r][c]!==0){
      S.history.push({type:'place',r,c,prev:S.board[r][c],next:0});
      S.board[r][c]=0;
    }
  }else{
    const prev=S.board[r][c];
    if(prev===n)return;
    S.history.push({type:'place',r,c,prev,next:n});
    S.board[r][c]=n;
    S.notes[r][c].clear();
    // 自动移除相关笔记
    removeRelatedNotes(r,c,n);
    playSound('place');

    // 检查错误
    if(S.autoCheck&&n!==S.solution[r][c]){
      S.mistakes++;
      playSound('error');
      if(S.mistakes>=MAX_MISTAKES){
        updateBoard();
        setTimeout(gameOver,400);
        return;
      }
    }

    // 检查完成
    if(checkComplete()){
      setTimeout(gameComplete,300);
      return;
    }
  }
  updateBoard();
}

function removeRelatedNotes(r,c,n){
  for(let i=0;i<9;i++){S.notes[r][i].delete(n);S.notes[i][c].delete(n);}
  const br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;
  for(let i=br;i<br+3;i++)for(let j=bc;j<bc+3;j++)S.notes[i][j].delete(n);
}

function checkComplete(){
  for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(S.board[r][c]!==S.solution[r][c])return false;
  return true;
}

function gameComplete(){
  clearInterval(timerInterval);
  const hintsUsed=MAX_HINTS-S.hintsLeft;
  const score=calcScore(S.difficulty,S.timer,S.mistakes,hintsUsed);
  const stars=calcStars(S.difficulty,score);

  // 更新统计
  S.totalSolved++;S.totalTime+=S.timer;
  S.savedGame=null;

  // 更新关卡数据
  if(!S.isDaily&&S.level>=0){
    const key=S.difficulty+'_'+S.level;
    const ld=S.levelData[key]||{};
    if(!ld.bestScore||score>ld.bestScore){ld.bestScore=score;ld.bestTime=S.timer;}
    if(!ld.stars||stars>ld.stars)ld.stars=stars;
    ld.completed=true;S.levelData[key]=ld;
  }

  // 每日挑战
  if(S.isDaily){
    S.lastDaily=today();S.dailyStreak++;S.dailyDone++;
  }

  // 成就
  checkAchievements({time:S.timer,mistakes:S.mistakes,hintsUsed,difficulty:S.difficulty});
  save();

  // 显示完成弹窗
  playSound('complete');
  launchConfetti();
  const m=document.getElementById('modal-complete');
  m.classList.add('active');
  m.innerHTML=`<div class="modal">
    <h2>${S.mistakes===0?'Perfect!':'Puzzle Complete!'}</h2>
    <div class="stars-display">${'<i class="fa-solid fa-star"></i>'.repeat(stars)+'<i class="fa-regular fa-star" style="opacity:.2"></i>'.repeat(3-stars)}</div>
    <div class="score-display">${score}</div>
    <p>Time: ${fmt(S.timer)} &middot; Mistakes: ${S.mistakes} &middot; Hints: ${hintsUsed}</p>
    <button class="btn btn-primary" onclick="nextPuzzle()">Next Puzzle</button>
    <button class="btn btn-secondary" onclick="closeModal('modal-complete');go('home')">Home</button>
  </div>`;
}

function gameOver(){
  clearInterval(timerInterval);
  S.savedGame=null;save();
  const m=document.getElementById('modal-gameover');
  m.classList.add('active');
  m.innerHTML=`<div class="modal">
    <h2 style="color:var(--err)">Game Over</h2>
    <p>You made ${MAX_MISTAKES} mistakes. Try again!</p>
    <button class="btn btn-primary" onclick="closeModal('modal-gameover');retryPuzzle()">Retry</button>
    <button class="btn btn-secondary" onclick="closeModal('modal-gameover');go('home')">Home</button>
  </div>`;
}

function nextPuzzle(){
  closeModal('modal-complete');
  if(S.isDaily){go('home');return;}
  const next=S.level+1;
  if(next<LVLS&&isLevelUnlocked(S.difficulty,next))startLevel(next);
  else go('levels');
}
function retryPuzzle(){
  if(S.isDaily)startDaily();else startLevel(S.level);
}

function doUndo(){
  if(!S.history.length)return;
  const h=S.history.pop();
  if(h.type==='place'){S.board[h.r][h.c]=h.prev;}
  else if(h.type==='note'){S.notes[h.r][h.c]=h.prev;}
  updateBoard();playSound('tap');
}

function doErase(){
  if(!S.selected)return;
  const {r,c}=S.selected;
  if(S.puzzle[r][c]!==0)return;
  if(S.board[r][c]!==0){
    S.history.push({type:'place',r,c,prev:S.board[r][c],next:0});
    S.board[r][c]=0;
  }else if(S.notes[r][c].size>0){
    S.history.push({type:'note',r,c,prev:new Set(S.notes[r][c]),next:new Set()});
    S.notes[r][c].clear();
  }
  updateBoard();playSound('tap');
}

function toggleNotes(){
  S.notesMode=!S.notesMode;
  const btn=document.getElementById('notes-btn');
  if(btn)btn.classList.toggle('active',S.notesMode);
  playSound('tap');
}

function doHint(){
  if(S.hintsLeft<=0){toast('No hints remaining');return;}
  // 找一个空格子填入正确答案
  const empties=[];
  for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(S.board[r][c]!==S.solution[r][c])empties.push({r,c});
  if(!empties.length)return;
  // 优先填选中的格子
  let target;
  if(S.selected&&S.board[S.selected.r][S.selected.c]!==S.solution[S.selected.r][S.selected.c]){
    target=S.selected;
  }else{
    target=empties[Math.floor(Math.random()*empties.length)];
  }
  S.hintsLeft--;
  S.history.push({type:'place',r:target.r,c:target.c,prev:S.board[target.r][target.c],next:S.solution[target.r][target.c]});
  S.board[target.r][target.c]=S.solution[target.r][target.c];
  S.notes[target.r][target.c].clear();
  removeRelatedNotes(target.r,target.c,S.solution[target.r][target.c]);
  S.selected=target;
  updateBoard();
  playSound('hint');
  // 动画
  const cells=document.querySelectorAll('.cell');
  cells.forEach(cell=>{
    if(cell.dataset.r==target.r&&cell.dataset.c==target.c)cell.classList.add('hint-cell');
  });
  toast('Hint revealed!');

  if(checkComplete())setTimeout(gameComplete,300);
}

function setTheme(t){
  if(t!=='default'&&!S.ownedThemes.includes(t)&&!S.premium){toast('Unlock this theme in the Shop');return;}
  S.theme=t;save();applyTheme();render();
}

function purchaseItem(id){
  // 模拟购买
  if(id==='noAds'){S.noAds=true;toast('Ads removed! Enjoy!');}
  else if(id==='premium'){S.premium=true;S.noAds=true;S.ownedThemes=['default','ember','forest','rose'];toast('Premium activated!');}
  else if(id.startsWith('theme_')){
    const t=id.replace('theme_','');
    S.ownedThemes.push(t);S.theme=t;toast('Theme unlocked!');
  }
  save();render();
}

function closeModal(id){document.getElementById(id).classList.remove('active');}

// ==================== 五彩纸屑 ====================
function launchConfetti(){
  const canvas=document.createElement('canvas');
  canvas.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999';
  document.body.appendChild(canvas);
  const ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const colors=['#0D7377','#D4940A','#C75030','#2D8F4E','#B84060','#14BDBD','#F0B840'];
  const particles=[];
  for(let i=0;i<120;i++){
    particles.push({
      x:canvas.width/2+(Math.random()-.5)*200,y:canvas.height*.4,
      vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,
      w:Math.random()*8+4,h:Math.random()*4+2,
      color:colors[Math.floor(Math.random()*colors.length)],
      rot:Math.random()*360,rv:(Math.random()-.5)*10,
      g:.28,op:1
    });
  }
  function anim(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive=false;
    for(const p of particles){
      p.x+=p.vx;p.vy+=p.g;p.y+=p.vy;p.rot+=p.rv;p.op-=.006;
      if(p.op<=0)continue;alive=true;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);
      ctx.globalAlpha=Math.max(0,p.op);ctx.fillStyle=p.color;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
    }
    if(alive)requestAnimationFrame(anim);else canvas.remove();
  }
  anim();
}

// ==================== 事件委托 ====================
document.getElementById('app').addEventListener('click',e=>{
  // 棋盘格子点击
  const cell=e.target.closest('.cell');
  if(cell&&S.screen==='game'){
    selectCell(+cell.dataset.r,+cell.dataset.c);return;
  }
  // 数字键盘点击
  const numBtn=e.target.closest('.num-btn');
  if(numBtn&&S.screen==='game'){
    placeNumber(+numBtn.dataset.num);return;
  }
});

// 键盘支持
document.addEventListener('keydown',e=>{
  if(S.screen!=='game'||!S.selected)return;
  const n=parseInt(e.key);
  if(n>=1&&n<=9){placeNumber(n);return;}
  if(e.key==='Backspace'||e.key==='Delete'){doErase();return;}
  if(e.key==='z'&&(e.ctrlKey||e.metaKey)){doUndo();return;}
  if(e.key==='n'){toggleNotes();return;}
  // 方向键移动
  const {r,c}=S.selected;
  let nr=r,nc=c;
  if(e.key==='ArrowUp')nr=Math.max(0,r-1);
  else if(e.key==='ArrowDown')nr=Math.min(8,r+1);
  else if(e.key==='ArrowLeft')nc=Math.max(0,c-1);
  else if(e.key==='ArrowRight')nc=Math.min(8,c+1);
  if(nr!==r||nc!==c){selectCell(nr,nc);e.preventDefault();}
});

// ==================== 初始化 ====================
load();
applyTheme();
render();

// 检查每日连胜是否断了
if(S.lastDaily){
  const last=new Date(S.lastDaily),now=new Date(today());
  const diff=(now-last)/(1000*60*60*24);
  if(diff>1)S.dailyStreak=0;
}
